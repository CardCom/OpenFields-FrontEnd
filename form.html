<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="./form.css">
    <script src="./form.js"></script>
    <script>
        var cardcom3DSScript = document.createElement('script');
        const time = new Date().getTime();
        cardcom3DSScript.setAttribute('src', 'https://secure.cardcom.solutions/External/OpenFields/3DS.js?v=' + time);
        document.head.appendChild(cardcom3DSScript);
    </script>
    <title>Cardcom Example</title>
</head>

<body>
    <div id="first-screen">
        <div class="summary-container">
            <div class="container">
                <h4>Cart <span class="price" style="color:black"><i class="fa fa-shopping-cart" aria-hidden="true"></i> <b>4</b></span>
                </h4>
                <p><a href="#">Product 1</a> <span class="price">$15</span></p>
                <p><a href="#">Product 2</a> <span class="price">$5</span></p>
                <p><a href="#">Product 3</a> <span class="price">$8</span></p>
                <p><a href="#">Product 4</a> <span class="price">$2</span></p>
                <hr>
                <p>Total <span class="price" style="color:black"><b>$30</b></span></p>
            </div>
        </div>
        <input type="button" id="continue" value="Continue to checkout" class="btn">
    </div>
    <div id="second-screen" style="display: none;">
        <div class="container">
            <form action="" id="form">
                <div class="row">
                    <div class="col-50">
                        <h3>Billing Address</h3>
                        <label for="cname"><i class="fa fa-user" aria-hidden="true"></i> Full Name</label>
                        <input type="text" id="cname" name="fname" autocomplete="name" placeholder="John M. Doe">
                        <label for="cardOwnerEmail"><i class="fa fa-envelope" aria-hidden="true"></i> Email</label>
                        <input type="text" id="cardOwnerEmail" name="email" autocomplete="email" onblur="setCardOwnerDetails()"
                            placeholder="john@example.com">
                        <label for="adr"><i class="fa fa-address-card-o" aria-hidden="true"></i> Address</label>
                        <input type="text" id="adr" name="address" autocomplete="street-address" placeholder="542 W. 15th Street">
                        <label for="city"><i class="fa fa-institution" aria-hidden="true"></i> City</label>
                        <input type="text" id="city" name="city" autocomplete="address-level2" placeholder="New York">

                        <div class="row">
                            <div class="col-50">
                                <label for="state">State</label>
                                <input type="text" id="state" name="state" autocomplete="address-level1" placeholder="NY">
                            </div>
                            <div class="col-50">
                                <label for="zip">Zip</label>
                                <input type="text" id="zip" name="zip" autocomplete="postal-code" placeholder="10001">
                            </div>
                        </div>
                        <input type="submit" id="submit-btn" value="Submit Payment" class="btn">
                    </div>
                    <div class="col-50">
                        <h3>Payment</h3>
                        <label id="accepted-cards-label">Accepted Cards</label>
                        <div class="icon-container" role="group" aria-labelledby="accepted-cards-label">
                            <i class="fa fa-cc-visa" style="color:navy;" role="img" aria-label="Visa"></i>
                            <i class="fa fa-cc-amex" style="color:blue;" role="img" aria-label="American Express"></i>
                            <i class="fa fa-cc-mastercard" style="color:red;" role="img" aria-label="Mastercard"></i>
                            <i class="fa fa-cc-discover" style="color:orange;" role="img" aria-label="Discover"></i>
                        </div>
                        <label for="cardOwnerName">Name on Card</label>
                        <input type="text" id="cardOwnerName" name="cardOwnerName" autocomplete="cc-name" onblur="setCardOwnerDetails()"
                            placeholder="John More Doe">
                        <!-- A <label> can't point into a cross-origin iframe: the iframe gets its name from `title`,
                             and the input inside it gets a translated aria-label from ?language=. -->
                        <label id="ccnum-label">Credit card number</label>
                        <!-- ?language= sets <html lang> inside each Cardcom iframe (screen readers use it).
                             Supported: he (default), en, ar, ru, fr, it, es, de, pt, nl, sv. Unknown values fall back to he.
                             Use the same value as `language` in the init message (form.js).
                             allow="payment" is required on every Cardcom payment iframe, otherwise the browser blocks the wallet APIs. -->
                        <!-- The master frame has no UI: keep it out of the accessibility tree and the tab order. -->
                        <iframe id="CardComMasterFrame" name="CardComMasterFrame" allow="payment"
                            aria-hidden="true" tabindex="-1"
                            src="https://secure.cardcom.solutions/api/openfields/master?language=he"
                            style="display: block;width:0px;height:0px;"></iframe>
                        <iframe id="CardComCardNumber" name="CardComCardNumber" allow="payment" title="Credit card number"
                            src="https://secure.cardcom.solutions/api/openfields/cardNumber?language=he"
                            style="width:100%;height:57px;"></iframe>
                        <div class="expDate">
                            <div class="expMonth">
                                <label for="expirationMonth">Exp Month</label>
                                <input type="text" id="expirationMonth" name="expirationMonth" value="05"
                                    autocomplete="cc-exp-month" inputmode="numeric" placeholder="05">
                            </div>
                            <div class="expYear">
                                <label for="expirationYear">Exp Year</label>
                                <input type="text" id="expirationYear" name="expirationYear" value="25"
                                    autocomplete="cc-exp-year" inputmode="numeric" placeholder="26">
                            </div>
                            <div class="cvv">
                                <label class="cvv-label" id="cvv-label">CVV</label>
                                <iframe id="CardComCvv" name="CardComCvv" allow="payment" title="Security code (CVV)"
                                    src="https://secure.cardcom.solutions/api/openfields/CVV?language=he"
                                    style="max-width: 188px;height:57px;"></iframe>
                            </div>
                        </div>
                        <!-- Google Pay and Apple Pay each have their own visible iframe that renders
                             the native button and runs the payment sheet inside the frame. -->

                        <div id="external-payments" style="display: block; margin-top: 15px;">
                            <div class="payment-separator"><span>or pay with</span></div>
                            <!-- Hidden by default; revealed after the master frame reports availability
                                 via the 'initialized' message. The terminalNumber must match TERMINAL_NUMBER in form.js. -->
                            <iframe id="CardComApplePay" name="CardComApplePay" allow="payment" title="Apple Pay"
                                src="https://secure.cardcom.solutions/api/openfields/ApplePay?terminalNumber=1000&language=he"
                                style="display:none; width:100%; height:48px; border:none; margin-bottom:10px;"></iframe>
                            <iframe id="CardComGooglePay" name="CardComGooglePay" allow="payment" title="Google Pay"
                                src="https://secure.cardcom.solutions/api/openfields/GooglePay?terminalNumber=1000&language=he"
                                style="display:none; width:100%; height:48px; border:none;"></iframe>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div class="footer">
            <!-- credits supported languages: en, he. types: short, long -->
            <iframe id="CardcomCredits" name="CardcomCredits" title="Cardcom"
                src="https://secure.cardcom.solutions/api/openfields/credits?language=he&type=long" width="100%" height="100%"
                style="z-index: 2;"></iframe>
        </div>

    </div>
    <div id="loading" style="display: none;">
        <!-- Credit to https://loading.io/css/ -->
        <div class="lds-spinner">
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
        </div>
    </div>
</body>

<!-- Example CSS stored in template  -->
<template id="css_template">
    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .cvvField {
            border: 1px solid #ccc;
            border-radius: 3px;
            height: 39px;
            margin: 0;
            padding: 0 10px;
            width: 165px;
        }

        .cvvField.invalid{
            border: 1px solid #c01111;
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</template>

</html>
